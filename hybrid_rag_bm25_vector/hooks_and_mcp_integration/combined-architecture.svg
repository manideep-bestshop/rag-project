<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { fill: #e2e8f0; font-size: 23px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 12.5px; }
      .lane-label { fill: #64748b; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; }
      .node-box { fill: #1e293b; stroke-width: 2; rx: 12; ry: 12; }
      .node-title { fill: #f1f5f9; font-size: 13px; font-weight: 700; }
      .node-sub { fill: #94a3b8; font-size: 10px; }
      .skip-box { fill: #1e293b; stroke: #64748b; stroke-width: 2; stroke-dasharray: 5 4; rx: 12; ry: 12; }
      .connector { fill: none; stroke-width: 2; stroke-dasharray: 6 4; opacity: 0.65; }
      .orange-stroke { stroke: #d95926; }
      .teal-stroke { stroke: #199e70; }
      .blue-stroke { stroke: #3987e5; }
      .violet-stroke { stroke: #9085e9; }
      .skip-stroke { stroke: #64748b; }
      .edge-label { fill: #94a3b8; font-size: 10px; }
    </style>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d95926"/></marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#199e70"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3987e5"/></marker>
    <marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9085e9"/></marker>
    <marker id="arrow-skip" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
  </defs>

  <rect x="0" y="0" width="1500" height="660" fill="#0f172a"/>

  <text x="40" y="34" class="title">Combining Hooks + MCP Tool Calling — Aventro Support Copilot (proposed)</text>
  <text x="40" y="54" class="subtitle">Hooks decide WHETHER and WHEN; MCP tools do the deliberate, confirmable work</text>

  <!-- ===================== LANE 1 ===================== -->
  <text x="40" y="86" class="lane-label">AUTO-GROUNDING — three relevance tiers (UserPromptSubmit)</text>

  <!-- A -->
  <g>
    <rect x="40" y="108" width="150" height="88" class="node-box" stroke="#d95926"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></rect>
    <text x="56" y="136" class="node-title">A. User Prompt</text>
    <text x="56" y="154" class="node-sub">"roadside assistance</text>
    <text x="56" y="167" class="node-sub">for a Swift Sedan tyre?"</text>
  </g>
  <!-- B -->
  <g>
    <rect x="220" y="108" width="200" height="88" class="node-box" stroke="#d95926"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.3s" repeatCount="indefinite"/></rect>
    <text x="236" y="136" class="node-title">B. UserPromptSubmit</text>
    <text x="236" y="154" class="node-sub">aventro_ground.py</text>
    <text x="236" y="167" class="node-sub">BM25 score → 3 bands</text>
  </g>
  <path d="M190,152 H218" class="connector orange-stroke" marker-end="url(#arrow-orange)"/>
  <circle r="4" fill="#d95926"><animateMotion dur="1.3s" repeatCount="indefinite" path="M190,152 H218"/></circle>

  <!-- ambiguous band: main animated path -->
  <path d="M420,145 H448" class="connector violet-stroke" marker-end="url(#arrow-violet)"/>
  <circle r="4" fill="#9085e9"><animateMotion dur="1.3s" repeatCount="indefinite" begin="0.3s" path="M420,145 H448"/></circle>

  <g>
    <rect x="450" y="108" width="200" height="88" class="node-box" stroke="#9085e9"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect>
    <text x="466" y="136" class="node-title">C. Inject HINT</text>
    <text x="466" y="154" class="node-sub">not full context — just a</text>
    <text x="466" y="167" class="node-sub">pointer: "consider the tool"</text>
  </g>
  <path d="M650,152 H678" class="connector violet-stroke" marker-end="url(#arrow-violet)"/>
  <circle r="4" fill="#9085e9"><animateMotion dur="1.3s" repeatCount="indefinite" begin="0.9s" path="M650,152 H678"/></circle>

  <g>
    <rect x="680" y="108" width="210" height="88" class="node-box" stroke="#9085e9"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.9s" repeatCount="indefinite"/></rect>
    <text x="696" y="136" class="node-title">D. Claude Decides</text>
    <text x="696" y="154" class="node-sub">reads hint + prompt, CHOOSES</text>
    <text x="696" y="167" class="node-sub">to call the MCP tool</text>
  </g>
  <path d="M890,152 H918" class="connector blue-stroke" marker-end="url(#arrow-blue)"/>
  <circle r="4" fill="#3987e5"><animateMotion dur="1.3s" repeatCount="indefinite" begin="1.2s" path="M890,152 H918"/></circle>

  <g>
    <rect x="920" y="108" width="220" height="88" class="node-box" stroke="#3987e5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect>
    <text x="936" y="131" class="node-title">E. ask_aventro_question</text>
    <text x="936" y="149" class="node-sub">MCP tool → hybrid_search()</text>
    <text x="936" y="162" class="node-sub">+ generate_answer() (Ollama)</text>
    <text x="936" y="178" class="node-sub">same engine as ask.py, unchanged</text>
  </g>
  <path d="M1140,152 H1168" class="connector blue-stroke" marker-end="url(#arrow-blue)"/>
  <circle r="4" fill="#3987e5"><animateMotion dur="1.3s" repeatCount="indefinite" begin="1.5s" path="M1140,152 H1168"/></circle>

  <g>
    <rect x="1170" y="108" width="180" height="88" class="node-box" stroke="#d95926"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/></rect>
    <text x="1186" y="136" class="node-title">F. Claude Answers</text>
    <text x="1186" y="154" class="node-sub">grounded + cited,</text>
    <text x="1186" y="167" class="node-sub">via a DELIBERATE tool call</text>
  </g>

  <!-- side bands: skip + auto-inject -->
  <path d="M320,196 V240" class="connector skip-stroke" marker-end="url(#arrow-skip)"/>
  <text x="332" y="222" class="edge-label">&lt; low floor</text>
  <g>
    <rect x="230" y="240" width="190" height="58" class="skip-box"/>
    <text x="244" y="262" class="node-title" fill="#cbd5e1">Skip (not relevant)</text>
    <text x="244" y="278" class="node-sub">no injection, ~0 cost</text>
  </g>

  <path d="M550,196 V240" class="connector teal-stroke" marker-end="url(#arrow-teal)"/>
  <text x="562" y="222" class="edge-label" fill="#4fc99a">&gt;= high floor</text>
  <g>
    <rect x="460" y="240" width="200" height="58" class="node-box" stroke="#199e70"/>
    <text x="474" y="262" class="node-title">Auto-inject directly</text>
    <text x="474" y="278" class="node-sub">confident match — skip the tool call</text>
  </g>
  <path id="auto-to-f" d="M660,269 H1260 V198" class="connector teal-stroke" marker-end="url(#arrow-teal)"/>
  <circle r="4" fill="#199e70"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.4s"><mpath href="#auto-to-f"/></animateMotion></circle>

  <!-- ===================== LANE 2 ===================== -->
  <text x="40" y="358" class="lane-label">GUARDRAIL → CONFIRMABLE TOOL (the only path that can mutate either index)</text>

  <g>
    <rect x="40" y="380" width="230" height="88" class="node-box" stroke="#d95926"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></rect>
    <text x="56" y="408" class="node-title">G. Bash: ingest.py --reset</text>
    <text x="56" y="426" class="node-sub">attempted directly</text>
    <text x="56" y="440" class="node-sub">(raw, unsanctioned path)</text>
  </g>
  <path d="M270,424 H318" class="connector orange-stroke" marker-end="url(#arrow-orange)"/>
  <circle r="4" fill="#d95926"><animateMotion dur="1.3s" repeatCount="indefinite" path="M270,424 H318"/></circle>

  <g>
    <rect x="320" y="380" width="220" height="88" class="node-box" stroke="#d95926"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.3s" repeatCount="indefinite"/></rect>
    <text x="336" y="404" class="node-title">H. PreToolUse Guardrail</text>
    <text x="336" y="422" class="node-sub">BLOCKS the raw command,</text>
    <text x="336" y="436" class="node-sub">reason names the tool below</text>
  </g>
  <path d="M540,424 H578" class="connector violet-stroke" marker-end="url(#arrow-violet)"/>
  <text x="559" y="410" text-anchor="middle" class="edge-label" fill="#b7adf0">redirect</text>
  <circle r="4" fill="#9085e9"><animateMotion dur="1.3s" repeatCount="indefinite" begin="0.6s" path="M540,424 H578"/></circle>

  <g>
    <rect x="580" y="380" width="280" height="88" class="node-box" stroke="#9085e9"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect>
    <text x="596" y="404" class="node-title">I. reindex_aventro_corpus</text>
    <text x="596" y="422" class="node-sub">(confirm=false) — DRY RUN</text>
    <text x="596" y="436" class="node-sub">shows which files changed, mutates nothing</text>
  </g>
  <path d="M860,424 H898" class="connector blue-stroke" marker-end="url(#arrow-blue)"/>
  <circle r="4" fill="#3987e5"><animateMotion dur="1.3s" repeatCount="indefinite" begin="0.9s" path="M860,424 H898"/></circle>

  <g>
    <rect x="900" y="380" width="280" height="88" class="node-box" stroke="#3987e5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.9s" repeatCount="indefinite"/></rect>
    <text x="916" y="404" class="node-title">K. reindex_aventro_corpus</text>
    <text x="916" y="422" class="node-sub">(confirm=true) — RUNS</text>
    <text x="916" y="436" class="node-sub">ingest.py --reset for real, rebuilds both indexes</text>
  </g>

  <!-- legend -->
  <g transform="translate(40,530)">
    <circle cx="6" cy="0" r="5" fill="#d95926"/>
    <text x="18" y="4" class="node-sub">Request / blocked attempt</text>
    <circle cx="260" cy="0" r="5" fill="#199e70"/>
    <text x="272" y="4" class="node-sub">Cheap always-on check / confident auto-path</text>
    <circle cx="560" cy="0" r="5" fill="#9085e9"/>
    <text x="572" y="4" class="node-sub">Hint / redirect (hook hands off to a tool)</text>
    <circle cx="830" cy="0" r="5" fill="#3987e5"/>
    <text x="842" y="4" class="node-sub">Deliberate MCP tool call (agent-initiated)</text>
    <circle cx="1120" cy="0" r="5" fill="#64748b"/>
    <text x="1132" y="4" class="node-sub">Skip path</text>
  </g>

  <text x="1460" y="580" text-anchor="end" class="node-sub">Proposed design — not yet implemented.</text>
  <text x="1460" y="596" text-anchor="end" class="node-sub">Reuses hybrid_retriever.py, bm25_index.py, ingest.py unchanged.</text>
</svg>
